<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير الطالب المباشر</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Firebase Web SDK (نفس مشروع نظام إدارة الطلاب) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC643pRpab9oPwAFFscv5m0WxZxm-uZdvY",
        authDomain: "student-management-marwan.firebaseapp.com",
        projectId: "student-management-marwan",
        storageBucket: "student-management-marwan.firebasestorage.app",
        messagingSenderId: "751206862738",
        appId: "1:751206862738:web:914b66c129f2222e8e3b4b"
    };

    const stateEl = document.getElementById('state');
    const cardEl = document.getElementById('card');
    let reportDb = null, reportKey = null;

    function getKeyFromHash() {
        const hash = window.location.hash || '';
        const match = hash.match(/k=([^&]+)/);
        return match ? decodeURIComponent(match[1]) : null;
    }

    function esc(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function gradeColor(pct) {
        if (pct >= 85) return 'var(--green)';
        if (pct >= 50) return 'var(--orange)';
        return 'var(--red)';
    }

    function getStudentStatus(gp, attPct) {
        if (gp === null && attPct === 0) return { label: 'لا توجد بيانات كافية', cls: 'status-neutral', color: 'var(--gray)' };
        if ((gp !== null && gp < 50) || attPct < 50) return { label: 'يحتاج متابعة', cls: 'status-warning', color: 'var(--red)' };
        if ((gp === null || gp >= 85) && attPct >= 85) return { label: 'منتظم وممتاز', cls: 'status-good', color: 'var(--green)' };
        return { label: 'منتظم — استمر', cls: 'status-mid', color: 'var(--yellow)' };
    }

    function getEncouragement(status, gp, attPct) {
        if (status.cls === 'status-good') return '🌟 ممتاز! أداء رائع، استمر بنفس الحماس.';
        if (status.cls === 'status-warning') return '💪 مع المتابعة والمراجعة هتتحسن نتيجتك بسرعة.';
        if (attPct >= 85) return '👏 حضورك ممتاز، ركّز أكثر على التدريبات للوصول للأفضل.';
        if (gp !== null && gp >= 70) return '✨ مستواك جيد، خطوة إضافية وتوصل للامتياز.';
        return '🚀 كل حصة وكل تدريب فرصة جديدة للتقدم.';
    }

    function buildTrainingRows(training) {
        if (!Array.isArray(training) || !training.length) {
            return '<div class="empty-row">لسه مفيش درجات مسجلة الشهر ده</div>';
        }
        return training.map((t, idx) => {
            const max = Number(t.mx) || 20;
            const val = Number(t.v) || 0;
            const pct = max > 0 ? Math.round((val / max) * 100) : 0;
            const color = gradeColor(pct);
            return `
                <div class="prog-row">
                    <div class="prog-top">
                        <span class="prog-label">${esc(t.l)}</span>
                        <span class="prog-value">${val}<span class="prog-value-of">/${max}</span></span>
                    </div>
                    <div class="prog-track">
                        <div class="prog-fill neon-fill" data-target="${pct}" style="width:0%;background:${color};box-shadow:0 0 8px ${color},0 0 16px ${color};transition-delay:${idx * 45}ms"></div>
                    </div>
                    <div class="prog-pct" style="color:${color}">${pct}%</div>
                </div>`;
        }).join('');
    }

    function scheduleDayMatches(dayText, todayIndex) {
        const aliases = { 'الأحد':0, 'الاحد':0, 'الإثنين':1, 'الاثنين':1, 'الاتنين':1, 'الثلاثاء':2, 'الأربعاء':3, 'الاربعاء':3, 'الخميس':4, 'الجمعة':5, 'السبت':6 };
        return String(dayText || '').split(/[،,\/|]+/).map(day => aliases[day.trim()]).includes(todayIndex);
    }
    function timeToMinutes(value) {
        const p = String(value || '').trim().split(':');
        if (p.length < 2) return null;
        const h = Number(p[0]), m = Number(p[1]);
        return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null;
    }

    function isSessionInProgress(r, sessionNumber, attendance) {
        if (!r.groupDay || !r.timeFrom || !r.timeTo) return false;
        if (!scheduleDayMatches(r.groupDay, new Date().getDay())) return false;
        const now = new Date();
        const from = timeToMinutes(r.timeFrom), to = timeToMinutes(r.timeTo), current = now.getHours() * 60 + now.getMinutes();
        if (from === null || to === null || to <= from) return false;
        const firstPending = (attendance || []).find(item => item.st === 'none');
        return current >= from && current < to && firstPending && Number(firstPending.s) === Number(sessionNumber);
    }

    function isScheduleTodayAndOpen(r) {
        if (!r.groupDay || !r.timeTo) return false;
        if (!scheduleDayMatches(r.groupDay, new Date().getDay())) return false;
        const to = timeToMinutes(r.timeTo);
        if (to === null) return false;
        const now = new Date(), current = now.getHours() * 60 + now.getMinutes();
        return current <= to;
    }

    function isRecordedToday(timestamp) {
        if (!timestamp) return false;
        const d = new Date(timestamp), now = new Date();
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    }

    function buildAttendanceRows(attendance, report) {
        if (!Array.isArray(attendance) || !attendance.length) {
            return '<div class="empty-row">لسه مفيش حصص مسجلة الشهر ده</div>';
        }
        const todayRecords = attendance.filter(item => isRecordedToday(item.at)).sort((x, y) => Number(y.at || 0) - Number(x.at || 0));
        const latestToday = todayRecords[0] || null;
        return attendance.map((a, idx) => {
            let pct = 0, color = 'var(--gray)', statusLabel = 'لم يحضر بعد', inProgress = false;
            const recordedAt = a.at ? new Date(a.at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';
            const attendingNow = a.st === 'present' && isScheduleTodayAndOpen(report) && latestToday && Number(latestToday.s) === Number(a.s);
            if (attendingNow) { pct = 50; color = 'var(--green)'; statusLabel = 'في الحصة الآن ✓'; inProgress = true; }
            else if (a.st === 'present') { pct = 100; color = 'var(--green)'; statusLabel = `حضر ✓${recordedAt ? ` — ${recordedAt}` : ''}`; }
            else if (a.st === 'absent') { pct = 100; color = 'var(--red)'; statusLabel = `غائب ✗${recordedAt ? ` — ${recordedAt}` : ''}`; }
            else if (!latestToday && isSessionInProgress(report, a.s, attendance)) { pct = 50; color = 'var(--red)'; statusLabel = 'لسا محضرش'; inProgress = true; }
            else { pct = 100; color = 'rgba(143,144,148,0.25)'; statusLabel = '—'; }
            return `
                <div class="prog-row">
                    <div class="prog-top">
                        <span class="prog-label">حصة ${a.s}</span>
                        <span class="prog-value" style="color:${a.st === 'none' ? 'var(--gray)' : color}">${statusLabel}</span>
                    </div>
                    <div class="prog-track">
                        <div class="prog-fill neon-fill ${inProgress ? 'in-progress' : ''}" data-target="${a.st === 'none' ? (inProgress ? 50 : 0) : pct}" style="width:0%;background:${color};box-shadow:0 0 8px ${color},0 0 16px ${color};${inProgress ? `box-shadow:0 0 12px ${color},0 0 22px ${color};` : ''}transition-delay:${idx * 45}ms"></div>
                    </div>
                </div>`;
        }).join('');
    }

    function animateBars() {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                document.querySelectorAll('.prog-fill').forEach(el => {
                    el.style.width = (el.dataset.target || 0) + '%';
                });
            });
        });
    }

    async function captureReportImage() {
        const rect = cardEl.getBoundingClientRect();
        if (window.html2canvas) {
            const canvas = await window.html2canvas(cardEl, { backgroundColor: '#1A1C26', scale: Math.min(2, Math.max(1.5, window.devicePixelRatio || 1)), useCORS: true, logging: false, onclone: clonedDoc => {
                const exportStyle = clonedDoc.createElement('style');
                exportStyle.textContent = '*{animation:none!important;transition:none!important;opacity:1!important;filter:none!important} .report-watermark{opacity:.16!important}';
                clonedDoc.head.appendChild(exportStyle);
                const clonedCard = clonedDoc.getElementById('card');
                if (clonedCard) { clonedCard.style.opacity = '1'; clonedCard.style.filter = 'none'; clonedCard.classList.remove('is-refreshing'); }
                clonedDoc.querySelectorAll('.report-watermark').forEach(mark => { mark.style.opacity = '.22'; mark.style.filter = 'none'; });
                clonedDoc.querySelectorAll('.floating-actions').forEach(actions => actions.remove());
            }});
            return await new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('empty image')), 'image/png'));
        }
        const clone = cardEl.cloneNode(true);
        clone.querySelectorAll('.floating-actions').forEach(el => el.remove());
        clone.style.cssText += `;display:block;width:${Math.ceil(rect.width)}px;max-width:none;position:relative;opacity:1;filter:none;`;
        clone.querySelectorAll('.report-watermark').forEach(mark => { mark.style.opacity = '.22'; mark.style.filter = 'none'; });
        clone.querySelectorAll('*').forEach(el => { el.style.animation = 'none'; el.style.transition = 'none'; el.style.opacity = '1'; el.style.filter = 'none'; });
        clone.querySelectorAll('.report-watermark').forEach(mark => { mark.style.opacity = '.16'; });
        const styles = Array.from(document.querySelectorAll('style')).map(style => style.textContent).join('\n');
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(rect.width)}" height="${Math.ceil(rect.height)}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${styles}</style>${clone.outerHTML}</div></foreignObject></svg>`;
        const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
        const image = new Image(); image.src = url;
        await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; });
        const canvas = document.createElement('canvas'); canvas.width = Math.ceil(rect.width * 2); canvas.height = Math.ceil(rect.height * 2);
        const ctx = canvas.getContext('2d'); ctx.scale(2, 2); ctx.fillStyle = '#1A1C26'; ctx.fillRect(0, 0, rect.width, rect.height); ctx.drawImage(image, 0, 0);
        URL.revokeObjectURL(url);
        return await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    }

    async function shareReportPage() {
        const title = document.querySelector('.student-name')?.textContent || 'تقرير الطالب';
        try {
            const blob = await captureReportImage();
            const file = new File([blob], `تقرير-${title}.png`, { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ title: `تقرير ${title}`, files: [file] });
            } else {
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = file.name; link.click();
                alert('تم تنزيل صورة التقرير للمشاركة');
            }
        } catch (e) { if (e?.name !== 'AbortError') alert('تعذر تجهيز صورة التقرير'); }
    }

    async function printReportPage() {
        try {
            const blob = await captureReportImage();
            const url = URL.createObjectURL(blob);
            const win = window.open('', '_blank');
            if (!win) { alert('اسمح بفتح النوافذ المنبثقة للطباعة'); return; }
            win.document.write(`<html dir="rtl"><head><title>تقرير الطالب</title><style>body{margin:0;background:#fff;text-align:center}img{max-width:100%;height:auto}</style></head><body><img src="${url}" onload="window.print()"></body></html>`);
            win.document.close();
        } catch (e) { alert('تعذر تجهيز صورة التقرير للطباعة'); }
    }

    let currentReport = null;
    function renderReport(r, selectedMonth) {
        currentReport = r;
        window.currentReport = r;
        const month = selectedMonth || r.m || '';
        const monthData = r.months && r.months[month] ? r.months[month] : r;
        r = { ...r, ...monthData, m: month };
        const gp = (r.gp === null || r.gp === undefined) ? null : Number(r.gp);
        const gpColor = gp !== null ? gradeColor(gp) : 'var(--purple)';
        const sessions = Number(r.as || 0);
        const present = Number(r.ap || 0);
        const attPct = sessions > 0 ? Math.round((present / sessions) * 100) : 0;
        const status = getStudentStatus(gp, attPct);

        const updated = r.updatedAt ? new Date(r.updatedAt) : (r.ts ? new Date(r.ts) : null);
        const updatedStr = updated ? updated.toLocaleString('ar-EG', { hour12: true }) : '';

        cardEl.innerHTML = `
            ${r.managerImage ? `<div class="report-watermark"><img src="${esc(r.managerImage)}" alt=""><span>${esc(r.managerName || 'مدير النظام')}</span>${r.managerContact ? `<small class="watermark-contact">📞 ${esc(r.managerContact)}</small>` : ''}</div>` : `<div class="report-watermark report-watermark-text"><span>${esc(r.managerName || 'مدير النظام')}</span>${r.managerContact ? `<small class="watermark-contact">📞 ${esc(r.managerContact)}</small>` : ''}</div>`}
            <div class="report-header">
                ${r.managerImage ? `<img class="manager-avatar" src="${esc(r.managerImage)}" alt="صورة مدير النظام">` : '<div class="manager-avatar avatar-placeholder">👤</div>'}
                <div class="header-identity"><div class="brand">${esc(r.brand || 'EduCenter')}</div><div class="manager-name">${esc(r.managerName || 'مدير النظام')}</div></div>
            </div>
            ${Number(r.rank) === 1 ? '<div class="rank-celebration" aria-label="المركز الأول"><span>✨</span><span>🎉</span><span>⭐</span><span>🎊</span><span>✨</span></div>' : ''}
            <div class="student-name">${esc(r.n || '—')}</div>
            <div class="student-sub">
                ${esc(r.g || '')}${r.grp ? ' — ' + esc(r.grp) : ''}${r.tr ? ' — ' + esc(r.tr) : ''}
                &nbsp;•&nbsp; #${esc(r.id ?? '')}
            </div>
            <div class="badges-row">
                <div class="badge">📅 ${esc(r.m || '')}</div>
                ${r.sched ? `<div class="badge">🕐 ${esc(r.sched)}</div>` : ''}
            </div>
            <div class="student-status ${status.cls}" style="color:${status.color}"><span class="status-dot"></span>${esc(status.label)}</div>
            <div class="report-controls">
                ${currentReport.months ? `<label class="month-picker">عرض بيانات شهر: <select id="reportMonth" onchange="window.renderReport(window.currentReport, this.value)">${Object.keys(currentReport.months).map(m => `<option value="${esc(m)}" ${m === month ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></label>` : ''}
                <button class="refresh-report-btn" onclick="refreshReport()" type="button">↻ تحديث البيانات</button>
            </div>

            <div class="summary-grid">
                <div class="summary-box">
                    <div class="summary-label">الدرجة الكلية</div>
                    <div class="summary-value" style="color:${gpColor}">${gp !== null ? gp + '%' : '—'}</div>
                </div>
                <div class="summary-box">
                    <div class="summary-label">نسبة الحضور</div>
                    <div class="summary-value" style="color:var(--green)">${attPct}%</div>
                </div>
                <div class="summary-box rank-box">
                    <div class="summary-label">🏆 ترتيبك في المجموعة</div>
                    <div class="rank-display"><span class="rank-medal">${r.rank === 1 ? '🥇' : (r.rank === 2 ? '🥈' : (r.rank === 3 ? '🥉' : '🏅'))}</span><span>${r.rank ? `#${r.rank}` : '—'}</span></div>
                </div>
            </div>
            <div class="encouragement ${status.cls}">${getEncouragement(status, gp, attPct)}</div>

            <div class="section-title">📝 درجات التدريبات — ${esc(r.m || '')}</div>
            <div class="prog-list">${buildTrainingRows(r.training)}</div>

            <div class="section-title">📋 سجل الحضور</div>
            <div class="prog-list">${buildAttendanceRows(r.attendance, r)}</div>

            ${updatedStr ? `<div class="updated-at">آخر تحديث: ${esc(updatedStr)}</div>` : ''}
            <div class="floating-actions" aria-label="إجراءات التقرير">
                <button class="floating-btn share" onclick="shareReportPage()" title="مشاركة التقرير">📤<span>مشاركة</span></button>
                <button class="floating-btn print" onclick="printReportPage()" title="طباعة التقرير">🖨️<span>طباعة</span></button>
            </div>
        `;
        stateEl.style.display = 'none';
        cardEl.style.display = 'block';
        animateBars();
    }

    function showError(msg) {
        stateEl.innerHTML = `<div class="err-icon">⚠️</div><div class="err-msg">${esc(msg)}</div>`;
    }

    async function refreshReport() {
        if (!reportDb || !reportKey) return;
        cardEl.classList.add('is-refreshing');
        const button = cardEl.querySelector('.refresh-report-btn');
        if (button) { button.disabled = true; button.innerHTML = '<span class="refresh-spinner"></span> جاري التحديث...'; }
        try {
            const snap = await getDoc(doc(reportDb, 'reports', reportKey));
            if (snap.exists()) renderReport(snap.data(), document.getElementById('reportMonth')?.value);
            else showError('لم يتم العثور على التقرير');
        } catch (e) { alert('تعذر تحديث البيانات، حاول مرة أخرى'); }
        finally { cardEl.classList.remove('is-refreshing'); }
    }

    window.renderReport = renderReport;
    window.shareReportPage = shareReportPage;
    window.printReportPage = printReportPage;
    window.refreshReport = refreshReport;

    async function init() {
        const key = getKeyFromHash();
        if (!key) {
            showError('الرابط غير صحيح — لا يوجد كود تقرير.');
            return;
        }
        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            reportDb = db; reportKey = key;
            const snap = await getDoc(doc(db, 'reports', key));
            if (!snap.exists()) {
                showError('لم يتم العثور على تقرير بهذا الكود. تأكد إن السنتر عمل مزامنة أخيرة.');
                return;
            }
            renderReport(snap.data());
        } catch (e) {
            console.error(e);
            showError('حدث خطأ أثناء تحميل التقرير. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.');
        }
    }

    init();
</script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');

    :root {
        --bg: #0F111A;
        --card: #1A1C26;
        --purple: #A336FF;
        --green: #00FFA3;
        --red: #FF3366;
        --orange: #FF8C00;
        --yellow: #FFD43B;
        --teal: #00BFA5;
        --white: #FFFFFF;
        --gray: #8F9094;
        --border: rgba(255,255,255,0.08);
        --glass: rgba(255,255,255,0.03);
        --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, rgba(163,54,255,0.15), transparent 60%), var(--bg);
        font-family: 'Tajawal', sans-serif;
        color: var(--white);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px 16px;
    }

    #state {
        text-align: center;
        color: var(--gray);
        margin-top: 40vh;
    }

    .spinner {
        width: 42px;
        height: 42px;
        border: 3px solid var(--border);
        border-top-color: var(--purple);
        border-radius: 50%;
        margin: 0 auto 16px;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-weight: 700; font-size: 15px; }
    .err-icon { font-size: 40px; margin-bottom: 10px; }
    .err-msg { font-weight: 700; font-size: 15px; max-width: 320px; line-height: 1.7; margin: 0 auto; }

    #card {
        display: none;
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px 22px;
        box-shadow: var(--shadow-lg);
        text-align: center;
        animation: fadeUp 0.4s ease;
        position:relative;
    }
    #card > *:not(.report-watermark) { position:relative; z-index:1; }
    .report-watermark { position:fixed; left:50%; top:50%; z-index:0; display:flex; flex-direction:column; align-items:center; gap:10px; transform:translate(-50%,-50%) rotate(-14deg); opacity:.28; pointer-events:none; filter:drop-shadow(0 8px 20px rgba(0,0,0,.18)); animation:watermarkFloat 7s ease-in-out infinite; }
    .report-watermark img { width:min(46vw,220px); height:min(46vw,220px); object-fit:cover; border-radius:50%; border:5px solid rgba(255,255,255,.82); filter:saturate(1.15) contrast(1.08); }
    .report-watermark span { color:#fff; font-size:clamp(18px,4vw,30px); font-weight:900; white-space:nowrap; text-shadow:0 2px 12px rgba(0,0,0,.55); }
    .report-watermark small { color:#fff; font-size:clamp(12px,2.7vw,17px); font-weight:800; direction:ltr; white-space:nowrap; text-shadow:0 2px 10px rgba(0,0,0,.55); }
    .report-watermark .watermark-contact { color:#75ffe0; text-shadow:0 0 5px #00e6b8, 0 0 12px #00bfa5, 0 2px 12px rgba(0,0,0,.65); letter-spacing:.4px; }
    .report-watermark-text { width:100%; }
    @keyframes watermarkFloat { 0%,100% { margin-top:-8px; } 50% { margin-top:8px; } }
    .student-status { display:inline-flex; align-items:center; gap:7px; border:1px solid currentColor; border-radius:999px; padding:7px 14px; font-size:12px; font-weight:900; margin:0 auto 16px; background:rgba(255,255,255,.035); }
    .status-dot { width:8px; height:8px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; }
    .status-good { color:var(--green); }
    .status-mid { color:var(--yellow); }
    .status-warning { color:var(--red); }
    .status-neutral { color:var(--gray); }
    .encouragement { border-radius:14px; padding:11px 12px; margin:-12px 0 22px; font-size:13px; font-weight:800; line-height:1.6; background:rgba(255,255,255,.035); border:1px solid var(--border); }
    .encouragement.status-good { background:rgba(0,255,163,.07); }
    .encouragement.status-mid { background:rgba(255,212,59,.07); }
    .encouragement.status-warning { background:rgba(255,51,102,.07); }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .brand {
        font-size: 13px;
        font-weight: 800;
        color: var(--purple);
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 14px;

    .report-header { display:flex; align-items:center; justify-content:center; gap:13px; margin-bottom:16px; }
    .manager-avatar { width:76px; height:76px; border-radius:50%; object-fit:cover; border:3px solid rgba(163,54,255,.7); box-shadow:0 0 0 5px rgba(163,54,255,.12),0 0 24px rgba(163,54,255,.35); }

    .rank-celebration { display:flex; justify-content:center; gap:13px; height:0; position:relative; z-index:2; pointer-events:none; }
    .rank-celebration span { font-size:20px; animation:celebrateFloat 1.8s ease-in-out infinite; }
    .rank-celebration span:nth-child(2) { animation-delay:.15s; }
    .rank-celebration span:nth-child(3) { animation-delay:.3s; }
    .rank-celebration span:nth-child(4) { animation-delay:.45s; }
    .rank-celebration span:nth-child(5) { animation-delay:.6s; }

        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }
    .report-controls { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin:-6px 0 20px; }
    .month-picker { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--gray); font-size:13px; font-weight:700; }
    .month-picker select { background:var(--glass); border:1px solid var(--border); color:var(--white); border-radius:10px; padding:7px 12px; font-family:inherit; font-weight:800; }
    .refresh-report-btn { border:1px solid rgba(163,54,255,.35); background:rgba(163,54,255,.12); color:#d39aff; border-radius:10px; padding:7px 14px; font-family:inherit; font-size:12px; font-weight:800; cursor:pointer; transition:.2s; }
    .refresh-report-btn:hover:not(:disabled) { background:rgba(163,54,255,.25); transform:translateY(-1px); }

    #card.is-refreshing > *:not(.report-watermark) { opacity:.72; transition:opacity .2s; }

        background: var(--glass);
        border: 1px solid var(--border);

        font-weight: 700;
        padding: 6px 14px;
        border-radius: 999px;

    .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 26px;
    }
    .summary-box {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 8px;
        animation: cardIn .45s ease both;

    .summary-box:nth-child(3) { animation-delay:.16s; }

    .summary-label { font-size: 12px; color: var(--gray); font-weight: 700; margin-bottom: 6px; }
    .summary-value { font-size: 24px; font-weight: 900; }

    .section-title {
        text-align: right;
        font-size: 14px;
        font-weight: 800;
        color: var(--white);
        margin: 22px 0 12px;
        padding-right: 2px;
    }

    .prog-list { display: flex; flex-direction: column; gap: 14px; }
    .empty-row { color: var(--gray); font-size: 13px; font-weight: 600; padding: 10px 0; text-align: center; }

    .prog-row { text-align: right; animation: rowIn .4s ease both; }
    .prog-row:nth-child(2) { animation-delay:.06s; }
    .prog-row:nth-child(3) { animation-delay:.12s; }
    .prog-row:nth-child(4) { animation-delay:.18s; }
    .prog-row:nth-child(5) { animation-delay:.24s; }

        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
    }
    .prog-label { font-size: 13px; font-weight: 700; color: var(--white); }
    .prog-value { font-size: 13px; font-weight: 800; color: var(--white); }
    .prog-value-of { font-size: 11px; font-weight: 600; color: var(--gray); }

    .prog-track {
        width: 100%;
        height: 10px;
        background: rgba(255,255,255,0.06);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
    }
    .prog-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.9s cubic-bezier(.22,1,.36,1);
        position:relative;
        overflow:hidden;
    }
    .neon-fill::after { content:""; position:absolute; inset:0; width:38%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent); transform:translateX(-140%); animation:neonSweep 2.4s ease-in-out infinite; }
    @keyframes neonSweep { 0%,35% { transform:translateX(-140%); } 70%,100% { transform:translateX(300%); } }
    .prog-fill.in-progress { box-shadow:0 0 12px rgba(255,212,59,.75); }
    .rank-box small { font-size:12px; color:var(--gray); font-weight:700; }
    .rank-box { background:linear-gradient(135deg,rgba(163,54,255,.16),rgba(255,212,59,.08)); border-color:rgba(163,54,255,.35); }
    .rank-display { display:flex; align-items:center; justify-content:center; gap:8px; color:#d8a3ff; font-size:28px; font-weight:900; text-shadow:0 0 14px rgba(163,54,255,.55); }
    .rank-medal { font-size:25px; filter:drop-shadow(0 0 7px rgba(255,212,59,.55)); }
    .prog-pct {
        text-align: left;
        font-size: 11px;
        font-weight: 800;
        margin-top: 4px;
    }

    .updated-at {
        font-size: 11px;
        color: var(--gray);
        border-top: 1px solid var(--border);
        padding-top: 14px;
        margin-top: 22px;
    }
    .floating-actions { position:sticky; bottom:12px; z-index:5; display:flex; justify-content:center; gap:10px; margin:24px auto -8px; pointer-events:none; }
    .floating-btn { pointer-events:auto; border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:10px 16px; color:#fff; font-family:inherit; font-size:13px; font-weight:800; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.28); backdrop-filter:blur(10px); transition:transform .2s, filter .2s; }
    .floating-btn:hover { transform:translateY(-2px); filter:brightness(1.1); }
    .floating-btn span { margin-right:6px; }
    .floating-btn.share { background:linear-gradient(135deg,#8d35ff,#b54dff); }
    .floating-btn.print { background:linear-gradient(135deg,#008fbe,#00bfa5); }
    @media print { .floating-actions { display:none; } #card { box-shadow:none; border:0; } .report-watermark { position:absolute; opacity:.1; } }

    @media (max-width: 380px) {
        .student-name { font-size: 20px; }
        .summary-value { font-size: 20px; }
    }
    @media (max-width: 600px) {
        html, body { padding:0 8px 18px; }
        #card { max-width:none; border-radius:18px; padding:22px 15px; margin-top:8px; }
        .brand { margin-bottom:3px; }
        .report-header { padding:10px 0 8px; }
        .manager-avatar { width:64px; height:64px; }
        .student-name { font-size:21px; }
        .summary-grid { gap:7px; }
        .summary-box { padding:12px 5px; }
        .summary-value { font-size:21px; }
        .prog-track { height:12px; }
    }
</style>
</head>
